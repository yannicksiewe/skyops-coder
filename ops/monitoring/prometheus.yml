global: { scrape_interval: 15s, evaluation_interval: 30s }
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: vllm
    static_configs:
      - { targets: ["127.0.0.1:8000"], labels: { service: chat } }
      - { targets: ["127.0.0.1:8001"], labels: { service: autocomplete } }
      - { targets: ["127.0.0.1:8002"], labels: { service: vision } }
  - job_name: node
    static_configs: [{ targets: ["127.0.0.1:9100"] }]
  - job_name: nvidia
    static_configs: [{ targets: ["127.0.0.1:9835"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["127.0.0.1:9090"] }]
