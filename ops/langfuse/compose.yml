# Langfuse v3 (self-hosted): traces with prompt/response content, latency, tokens, users, scores.
# Adapted from the official docker-compose: pinned images, secrets from /etc/langfuse/langfuse.env, localhost-only ports.
services:
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, minio: { condition: service_healthy }, redis: { condition: service_healthy }, clickhouse: { condition: service_healthy } }
    env_file: /etc/langfuse/langfuse.env
    ports: ["127.0.0.1:3030:3030"]
  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, minio: { condition: service_healthy }, redis: { condition: service_healthy }, clickhouse: { condition: service_healthy } }
    env_file: /etc/langfuse/langfuse.env
    ports: ["127.0.0.1:3002:3000"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    user: "101:101"
    environment: { CLICKHOUSE_DB: default, CLICKHOUSE_USER: clickhouse, CLICKHOUSE_PASSWORD_FILE: /run/secrets/ch }
    volumes: ["langfuse-clickhouse-data:/var/lib/clickhouse", "langfuse-clickhouse-logs:/var/log/clickhouse-server", "/etc/langfuse/clickhouse_password:/run/secrets/ch:ro"]
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"], interval: 5s, timeout: 5s, retries: 20, start_period: 10s }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    env_file: /etc/langfuse/minio.env
    volumes: ["langfuse-minio-data:/data"]
    ports: ["127.0.0.1:9095:9000"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 5s, retries: 20, start_period: 5s }
  redis:
    image: redis:7
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$(cat /run/secrets/redis)\" --maxmemory-policy noeviction"]
    volumes: ["/etc/langfuse/redis_password:/run/secrets/redis:ro"]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis)\" ping | grep PONG"], interval: 5s, timeout: 5s, retries: 20 }
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: langfuse, POSTGRES_DB: langfuse, POSTGRES_PASSWORD_FILE: /run/secrets/pg }
    volumes: ["langfuse-pg:/var/lib/postgresql/data", "/etc/langfuse/pg_password:/run/secrets/pg:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U langfuse"], interval: 5s, timeout: 3s, retries: 20 }
volumes:
  langfuse-pg:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
